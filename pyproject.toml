[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2md"
version = "0.1.0"
description = "Convert PDF files into clean, AI-friendly Markdown (or JSON page chunks)."
readme = "README.md"
requires-python = ">=3.11"
# pymupdf4llm must match the PyMuPDF version exactly; it does not declare this itself.
dependencies = [
    "pymupdf==2.0",
    "pymupdf4llm==2.0",
    "rapidocr",  # OCR engine for scanned pages
    "mcp>=1.10,<2",  # desktop-app connector (pdf2md-mcp)
]

[project.scripts]
pdf2md = "pdf2md.cli:main"
pdf2md-mcp = "pdf2md.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
